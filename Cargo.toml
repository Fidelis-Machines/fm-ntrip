[package]
name = "fm-ntrip"
version = "0.1.0"
edition = "2021"
description = "NTRIP server+caster: streams RTCM corrections from a USB serial source to NTRIP clients"
license = "MIT OR Apache-2.0"

[[bin]]
name = "fm-ntrip"
path = "src/main.rs"

[[bin]]
name = "fm-ntrip-client"
path = "src/client.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-serial = "5"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.22"

[dev-dependencies]
base64 = "0.22"
# PTY support for the fan-out integration test: a pseudo-terminal stands in for
# the USB serial device so the caster can be driven end-to-end without hardware.
nix = { version = "0.30", features = ["term"] }

[profile.release]
lto = "thin"
strip = true
